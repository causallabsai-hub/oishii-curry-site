<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>マイページ｜おいしいカレー屋</title>

  <style>
    body {
      margin: 0;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #fff8ee;
      color: #2b1a0f;
    }

    header {
      background: #b94b18;
      color: #fff;
      padding: 36px 16px;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    main {
      max-width: 700px;
      margin: 0 auto;
      padding: 30px 16px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow:
        0 8px 24px
        rgba(0, 0, 0, 0.08);
    }

    .button {
  display: block;
  width: 320px;
  max-width: 100%;

  box-sizing: border-box;

  margin: 16px auto 0;
  padding: 14px 18px;

  border-radius: 999px;

  text-align: center;
  text-decoration: none;

  color: #fff;
  font-weight: 700;

  box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12);
}

    .check-button {
      background: #8a4b12;
    }

    .cancel-button {
      background: #b3261e;
    }

    .top-button {
      background: #666;
    }
  </style>
</head>

<body>

  <header>
    <h1>マイページ</h1>
  </header>

  <main>

    <div class="card">

      <h2>予約メニュー</h2>

      <p>
        ご予約の確認・変更・キャンセルができます。
      </p>

      <a
        href="https://oishii-curry-site.vercel.app/reservation-cancel.html"
        class="button check-button"
      >
        予約内容を確認する
      </a>

      <a
        href="https://oishii-curry-site.vercel.app/reservation-cancel.html"
        class="button cancel-button"
      >
        予約キャンセル
      </a>

      <a
        href="https://causallabsai-hub.github.io/oishii-curry-site/"
        class="button top-button"
      >
        トップページへ戻る
      </a>

    </div>

  </main>

</body>
</html>
