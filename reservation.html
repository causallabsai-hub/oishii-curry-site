<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>おいしいカレー屋｜予約</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff8ed;
      color: #333;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      color: #8a4b12;
      font-size: 28px;
      text-align: center;
    }

    .lead {
      text-align: center;
      margin-bottom: 24px;
      line-height: 1.7;
      color: #555;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
      color: #4a2b12;
    }

    input,
    select,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #d8c4aa;
      border-radius: 8px;
      font-size: 16px;
      background: #fff;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .required {
      color: #d23b2d;
      font-size: 13px;
      margin-left: 4px;
    }

    .note {
      font-size: 13px;
      color: #777;
      margin-top: 6px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 999px;
      background: #d97706;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #result {
      margin-top: 24px;
      padding: 16px;
      border-radius: 12px;
      background: #fff3dc;
      white-space: pre-wrap;
      line-height: 1.7;
    }

    .reservation-status {
      display: inline-block;
      background: #16a34a;
      color: #fff;
      padding: 6px 12px;
      border-radius: 999px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .reservation-message {
      font-size: 18px;
      font-weight: 700;
      color: #8a4b12;
      margin-bottom: 12px;
    }

    .menu-button {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 16px;
      background: #8a4b12;
      color: #fff;
      text-decoration: none;
      border-radius: 999px;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <h1>おいしいカレー屋｜来店予約</h1>

      <p class="lead">
        ご来店日・時間・メニュー内容を入力してください。<br />
        空き時間を確認してから、予約を確定します。
      </p>

      <form id="reservationForm">
        <div class="form-group">
          <label for="visit_date">来店予定日 <span class="required">必須</span></label>
          <select id="visit_date" name="visit_date" required>
            <option value="">空き状況を読み込み中です...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="selected_time">希望時間 <span class="required">必須</span></label>
          <select id="selected_time" name="selected_time" required disabled>
            <option value="">先に来店予定日を選択してください</option>
          </select>
          <div class="note">予約枠は60分です。</div>
        </div>

        <div class="form-group">
          <label for="people_count">人数 <span class="required">必須</span></label>
          <input
            type="number"
            id="people_count"
            name="people_count"
            min="1"
            max="20"
            required
            placeholder="例：2"
          />
        </div>

        <div class="form-group">
          <label for="customer_name">お名前 <span class="required">必須</span></label>
          <input
            type="text"
            id="customer_name"
            name="customer_name"
            required
            placeholder="例：山田太郎"
          />
        </div>

        <div class="form-group">
          <label for="phone_number">電話番号 <span class="required">必須</span></label>
          <input
            type="tel"
            id="phone_number"
            name="phone_number"
            required
            placeholder="例：09012345678"
          />
        </div>

        <div class="form-group">
          <label for="email">メールアドレス <span class="required">必須</span></label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="例：example@example.com"
          />
          <div class="note">
            マイページのログイン・予約確認で使用します。
          </div>
        </div>

        <div class="form-group">
          <label for="curry_type">カレーの種類 <span class="required">必須</span></label>
          <select id="curry_type" name="curry_type" required>
            <option value="">選択してください</option>
            <option value="おいしいチキンカレー">おいしいチキンカレー</option>
            <option value="野菜たっぷりカレー">野菜たっぷりカレー</option>
            <option value="ビーフカレー">ビーフカレー</option>
            <option value="キーマカレー">キーマカレー</option>
            <option value="お子さまカレー">お子さまカレー</option>
          </select>
        </div>

        <div class="form-group">
          <label for="spice_level">辛さ <span class="required">必須</span></label>
          <select id="spice_level" name="spice_level" required>
            <option value="">選択してください</option>
            <option value="0辛">0辛</option>
            <option value="1辛">1辛</option>
            <option value="2辛">2辛</option>
            <option value="3辛">3辛</option>
            <option value="4辛">4辛</option>
            <option value="5辛">5辛</option>
          </select>
        </div>

        <div class="form-group">
          <label for="rice_size">ライス量 <span class="required">必須</span></label>
          <select id="rice_size" name="rice_size" required>
            <option value="">選択してください</option>
            <option value="少なめ">少なめ</option>
            <option value="普通">普通</option>
            <option value="大盛">大盛</option>
          </select>
        </div>

        <div class="form-group">
          <label for="topping">トッピング <span class="required">必須</span></label>
          <select id="topping" name="topping" required>
            <option value="">選択してください</option>
            <option value="なし">なし</option>
            <option value="からあげ">からあげ</option>
            <option value="チーズ">チーズ</option>
            <option value="温玉">温玉</option>
            <option value="野菜追加">野菜追加</option>
          </select>
        </div>

        <div class="form-group">
          <label for="quantity">数量 <span class="required">必須</span></label>
          <input
            type="number"
            id="quantity"
            name="quantity"
            min="1"
            max="20"
            required
            placeholder="例：1"
          />
        </div>

        <div class="form-group">
          <label for="allergy">アレルギー有無 <span class="required">必須</span></label>
          <select id="allergy" name="allergy" required>
            <option value="">選択してください</option>
            <option value="なし">なし</option>
            <option value="あり">あり</option>
          </select>
          <div class="note">
            アレルギーがある場合は、その他追加事項に内容をご記入ください。
          </div>
        </div>

        <div class="form-group">
          <label for="request_note">その他追加事項</label>
          <textarea
            id="request_note"
            name="request_note"
            placeholder="例：アレルギー内容、席の希望、苦手な食材など"
          ></textarea>
        </div>

        <button id="submitButton" type="submit">予約内容を送信する</button>
      </form>

      <div id="result"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById("reservationForm");
    const result = document.getElementById("result");
    const button = document.getElementById("submitButton");

    const visitDateSelect = document.getElementById("visit_date");
    const selectedTimeSelect = document.getElementById("selected_time");

    let availabilityData = [];

    async function loadAvailability() {
      try {
        visitDateSelect.innerHTML =
          '<option value="">空き状況を読み込み中です...</option>';

        selectedTimeSelect.innerHTML =
          '<option value="">先に来店予定日を選択してください</option>';

        selectedTimeSelect.disabled = true;

        const response = await fetch("/api/availability");

        if (!response.ok) {
          throw new Error("空き状況の取得に失敗しました。");
        }

        const data = await response.json();
        availabilityData = data.available_dates || [];

        visitDateSelect.innerHTML =
          '<option value="">空いている日を選択してください</option>';

        if (availabilityData.length === 0) {
          visitDateSelect.innerHTML =
            '<option value="">現在選択できる日付がありません</option>';
          return;
        }

        availabilityData.forEach((item) => {
          const option = document.createElement("option");
          option.value = item.date;
          option.textContent = item.label;
          visitDateSelect.appendChild(option);
        });
      } catch (error) {
        visitDateSelect.innerHTML =
          '<option value="">空き状況を取得できませんでした</option>';

        result.textContent =
          "空き状況の取得に失敗しました。\n時間をおいて再度お試しください。";
      }
    }

    visitDateSelect.addEventListener("change", () => {
      const selectedDate = visitDateSelect.value;

      const dateData = availabilityData.find(
        (item) => item.date === selectedDate
      );

      selectedTimeSelect.innerHTML = "";

      if (!selectedDate) {
        selectedTimeSelect.disabled = true;
        selectedTimeSelect.innerHTML =
          '<option value="">先に来店予定日を選択してください</option>';
        return;
      }

      if (!dateData || !dateData.slots || dateData.slots.length === 0) {
        selectedTimeSelect.disabled = true;
        selectedTimeSelect.innerHTML =
          '<option value="">空き時間がありません</option>';
        return;
      }

      selectedTimeSelect.disabled = false;
      selectedTimeSelect.innerHTML =
        '<option value="">空いている時間を選択してください</option>';

      dateData.slots.forEach((slot) => {
        const option = document.createElement("option");
        option.value = slot;
        option.textContent = slot;
        selectedTimeSelect.appendChild(option);
      });
    });

    function showReservationResult(payload, responseData) {
      result.textContent = "";

      const status = document.createElement("div");
      status.className = "reservation-status";
      status.textContent = "予約確定";

      const message = document.createElement("div");
      message.className = "reservation-message";
      message.textContent =
        responseData?.message || "ご予約ありがとうございます。ご来店お待ちしております。";

      const details = document.createElement("div");

      details.textContent =
`【予約内容】
予約ID：${responseData?.reservation_id || ""}
来店予定日：${payload.visit_date}
希望時間：${payload.selected_time}
人数：${payload.people_count}名様
お名前：${payload.customer_name}様
電話番号：${payload.phone_number}
メールアドレス：${payload.email}

【来店時の提供予定メニュー】
カレーの種類：${payload.curry_type}
辛さ：${payload.spice_level}
ライス量：${payload.rice_size}
トッピング：${payload.topping}
数量：${payload.quantity}個
アレルギー有無：${payload.allergy}
その他追加事項：${payload.request_note}`;

      const menuButton = document.createElement("a");
      menuButton.href = "https://causallabsai-hub.github.io/oishii-curry-site/";
      menuButton.className = "menu-button";
      menuButton.textContent = "メニューに戻る";

      result.appendChild(status);
      result.appendChild(message);
      result.appendChild(details);
      result.appendChild(menuButton);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      button.disabled = true;
      button.textContent = "予約処理中...";

      result.textContent = "ご予約内容確認しております。";

      const formData = new FormData(form);

      const payload = {
        visit_date: formData.get("visit_date"),
        selected_time: formData.get("selected_time"),
        people_count: Number(formData.get("people_count")),
        customer_name: formData.get("customer_name"),
        phone_number: formData.get("phone_number"),
        email: formData.get("email"),
        curry_type: formData.get("curry_type"),
        spice_level: formData.get("spice_level"),
        rice_size: formData.get("rice_size"),
        topping: formData.get("topping"),
        quantity: Number(formData.get("quantity")),
        allergy: formData.get("allergy"),
        request_note: formData.get("request_note") || "追加事項なし"
      };

      const processingTimer = setTimeout(() => {
        result.textContent = "予約確定処理中...";
      }, 700);

      try {
        const response = await fetch("/api/reservation", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const responseText = await response.text();

        let data;

        try {
          data = JSON.parse(responseText);
        } catch {
          throw new Error(
            "予約APIからJSONではない応答が返りました。api/reservation.js または Vercelの環境変数を確認してください。"
          );
        }

        clearTimeout(processingTimer);

        if (!response.ok) {
          throw new Error(
            data.error || data.message || "予約処理に失敗しました。"
          );
        }

        if (data.confirmed !== true) {
          throw new Error(
            "Googleカレンダーへの予約登録を確認できませんでした。"
          );
        }

        showReservationResult(payload, data);

        button.textContent = "予約確定しました";
      } catch (error) {
        clearTimeout(processingTimer);

        result.textContent =
          "予約処理に失敗しました。\n" +
          error.message +
          "\n\n予約は確定していません。もう一度お試しください。";

        button.disabled = false;
        button.textContent = "予約内容を送信する";
      }
    });

    loadAvailability();
  </script>
</body>
</html>
