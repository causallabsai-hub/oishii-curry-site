<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>おいしいカレー屋 予約フォーム</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff8ee;
      color: #2b1a0f;
      margin: 0;
      padding: 0;
    }

    header {
      background: #b94b18;
      color: #fff;
      padding: 24px 16px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    header p {
      margin: 0;
      font-size: 14px;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-top: 14px;
      margin-bottom: 6px;
    }

    input, select, textarea, button {
      width: 100%;
      box-sizing: border-box;
      font-size: 16px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #d6c4b5;
      background: #fff;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    button {
      margin-top: 20px;
      background: #b94b18;
      color: #fff;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result {
      white-space: pre-wrap;
      line-height: 1.7;
      background: #fffdf8;
      border: 1px solid #ead7c4;
      border-radius: 12px;
      padding: 16px;
      min-height: 80px;
    }

    .note {
      font-size: 14px;
      color: #6b4a35;
      line-height: 1.6;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 16px;
      color: #b94b18;
      font-weight: 700;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }

.reservation-status {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 14px;
      color: #b94b18;
    }

    .reservation-message {
      font-weight: 700;
      margin-bottom: 16px;
    }

    .menu-button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      background: #b94b18;
      color: #fff;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
    }

    .menu-button:hover {
      opacity: 0.9;
    }
    
  </style>
</head>
<body>
  <header>
    <h1>おいしいカレー屋</h1>
    <p>来店予約フォーム</p>
  </header>

  <main>
    <a class="back-link" href="https://causallabsai-hub.github.io/oishii-curry-site/">
      ← メニューサイトへ戻る
    </a>

    <section class="card">
      <h2>予約内容を入力してください</h2>
      <p class="note">
        空いている日時を選んで、予約内容を入力してください。
      </p>

      <form id="reservationForm">
        <label for="visit_date">来店予定日</label>
        <select id="visit_date" name="visit_date" required>
          <option value="">空いている日を選択してください</option>
        </select>

        <label for="selected_time">希望時間</label>
        <select id="selected_time" name="selected_time" required disabled>
          <option value="">先に来店予定日を選択してください</option>
        </select>

        <label for="people_count">人数</label>
        <input id="people_count" name="people_count" type="number" min="1" max="20" placeholder="例：2" required />

        <label for="customer_name">お名前</label>
        <input id="customer_name" name="customer_name" type="text" placeholder="例：伊藤" required />

        <label for="phone_number">電話番号</label>
        <input id="phone_number" name="phone_number" type="tel" placeholder="例：03-1234-5678" required />

        <label for="curry_type">カレーの種類</label>
        <select id="curry_type" name="curry_type" required>
          <option value="">選択してください</option>
          <option value="おいしいチキンカレー">おいしいチキンカレー</option>
          <option value="野菜たっぷりカレー">野菜たっぷりカレー</option>
          <option value="ビーフカレー">ビーフカレー</option>
          <option value="キーマカレー">キーマカレー</option>
          <option value="お子さまカレー">お子さまカレー</option>
        </select>

        <label for="spice_level">辛さ</label>
        <select id="spice_level" name="spice_level" required>
          <option value="">選択してください</option>
          <option value="0辛：辛くない">0辛：辛くない</option>
          <option value="1辛：甘口">1辛：甘口</option>
          <option value="2辛：中辛">2辛：中辛</option>
          <option value="3辛：辛口">3辛：辛口</option>
          <option value="4辛：かなり辛い">4辛：かなり辛い</option>
          <option value="5辛：激辛">5辛：激辛</option>
        </select>

        <label for="rice_size">ライス量</label>
        <select id="rice_size" name="rice_size" required>
          <option value="">選択してください</option>
          <option value="小盛">小盛</option>
          <option value="普通">普通</option>
          <option value="大盛">大盛</option>
          <option value="特盛">特盛</option>
        </select>

        <label for="topping">トッピング</label>
        <select id="topping" name="topping" required>
          <option value="">選択してください</option>
          <option value="なし">なし</option>
          <option value="チーズ">チーズ</option>
          <option value="温泉卵">温泉卵</option>
          <option value="からあげ">からあげ</option>
          <option value="野菜増し">野菜増し</option>
          <option value="カツ">カツ</option>
        </select>

        <label for="quantity">数量</label>
        <input id="quantity" name="quantity" type="number" min="1" value="1" required />

        <label for="allergy">アレルギー有無</label>
        <input id="allergy" name="allergy" type="text" placeholder="例：なし / 卵アレルギーあり" required />

        <label for="request_note">その他追加事項</label>
        <textarea id="request_note" name="request_note" placeholder="例：スプーン多め、入口近くの席希望"></textarea>

        <button id="submitButton" type="submit">予約内容を送信する</button>
      </form>
    </section>

    <section class="card">
      <h2>予約結果</h2>
      <div id="result" class="result">ここに予約結果が表示されます。</div>
    </section>
  </main>

  <script>
    const form = document.getElementById("reservationForm");
    const result = document.getElementById("result");
    const button = document.getElementById("submitButton");

    const visitDateSelect = document.getElementById("visit_date");
    const selectedTimeSelect = document.getElementById("selected_time");

    let availabilityData = [];

    async function loadAvailability() {
      try {
        visitDateSelect.innerHTML = '<option value="">空き状況を読み込み中です...</option>';
        selectedTimeSelect.innerHTML = '<option value="">先に来店予定日を選択してください</option>';
        selectedTimeSelect.disabled = true;

        const response = await fetch("/api/availability");

        if (!response.ok) {
          throw new Error("空き状況の取得に失敗しました。");
        }

        const data = await response.json();
        availabilityData = data.available_dates || [];

        visitDateSelect.innerHTML = '<option value="">空いている日を選択してください</option>';

        if (availabilityData.length === 0) {
          visitDateSelect.innerHTML = '<option value="">現在選択できる日付がありません</option>';
          return;
        }

        availabilityData.forEach((item) => {
          const option = document.createElement("option");
          option.value = item.date;
          option.textContent = item.label;
          visitDateSelect.appendChild(option);
        });
      } catch (error) {
        visitDateSelect.innerHTML = '<option value="">空き状況を取得できませんでした</option>';
        result.textContent = "空き状況の取得に失敗しました。\n時間をおいて再度お試しください。";
      }
    }

    visitDateSelect.addEventListener("change", () => {
      const selectedDate = visitDateSelect.value;
      const dateData = availabilityData.find((item) => item.date === selectedDate);

      selectedTimeSelect.innerHTML = "";

      if (!selectedDate) {
        selectedTimeSelect.disabled = true;
        selectedTimeSelect.innerHTML = '<option value="">先に来店予定日を選択してください</option>';
        return;
      }

      if (!dateData || !dateData.slots || dateData.slots.length === 0) {
        selectedTimeSelect.disabled = true;
        selectedTimeSelect.innerHTML = '<option value="">空き時間がありません</option>';
        return;
      }

      selectedTimeSelect.disabled = false;
      selectedTimeSelect.innerHTML = '<option value="">空いている時間を選択してください</option>';

      dateData.slots.forEach((slot) => {
        const option = document.createElement("option");
        option.value = slot;
        option.textContent = slot;
        selectedTimeSelect.appendChild(option);
      });
    });

     function showReservationResult(payload) {
      result.textContent = "";

      const status = document.createElement("div");
      status.className = "reservation-status";
      status.textContent = "予約確定";

      const message = document.createElement("div");
      message.className = "reservation-message";
      message.textContent = "ご予約ありがとうございます。ご来店お待ちしております。";

      const details = document.createElement("div");

      details.textContent =
`【予約内容】
来店予定日：${payload.visit_date}
希望時間：${payload.selected_time}
人数：${payload.people_count}名様
お名前：${payload.customer_name}様
電話番号：${payload.phone_number}

【来店時の提供予定メニュー】
カレーの種類：${payload.curry_type}
辛さ：${payload.spice_level}
ライス量：${payload.rice_size}
トッピング：${payload.topping}
数量：${payload.quantity}個
アレルギー有無：${payload.allergy}
その他追加事項：${payload.request_note}`;

      const menuButton = document.createElement("a");
      menuButton.href = "https://causallabsai-hub.github.io/oishii-curry-site/";
      menuButton.className = "menu-button";
      menuButton.textContent = "メニューに戻る";

      result.appendChild(status);
      result.appendChild(message);
      result.appendChild(details);
      result.appendChild(menuButton);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      button.disabled = true;
      button.textContent = "予約処理中...";

      result.textContent = "ご予約内容確認しております。";

      const formData = new FormData(form);

      const payload = {
        visit_date: formData.get("visit_date"),
        selected_time: formData.get("selected_time"),
        people_count: Number(formData.get("people_count")),
        customer_name: formData.get("customer_name"),
        phone_number: formData.get("phone_number"),
        curry_type: formData.get("curry_type"),
        spice_level: formData.get("spice_level"),
        rice_size: formData.get("rice_size"),
        topping: formData.get("topping"),
        quantity: Number(formData.get("quantity")),
        allergy: formData.get("allergy"),
        request_note: formData.get("request_note") || "追加事項なし"
      };

      const processingTimer = setTimeout(() => {
        result.textContent = "予約確定処理中...";
      }, 700);

      try {
        const response = await fetch("/api/reservation", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        clearTimeout(processingTimer);

        if (!response.ok) {
          throw new Error(data.error || "予約処理に失敗しました。");
        }

        if (data.confirmed !== true) {
          throw new Error("Googleカレンダーへの予約登録を確認できませんでした。");
        }

        showReservationResult(payload);

        button.textContent = "予約確定しました";
      } catch (error) {
        clearTimeout(processingTimer);

        result.textContent =
          "予約処理に失敗しました。\n" +
          error.message +
          "\n\n予約は確定していません。もう一度お試しください。";

        button.disabled = false;
        button.textContent = "予約内容を送信する";
      }
    });

        
    loadAvailability();
  </script>
</body>
</html>
